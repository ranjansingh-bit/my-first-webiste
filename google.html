<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="google.css">
</head>
<body>
    <main class="container">
        <div class="item1">
            <div class="about">About</div>
            <div class="store">Store</div>
            <div class="right-section">
                <div class="text">
                    <p>Gmail</p>
                    <p>Images</p>
                </div>
                <div class="logo-section">
                    <img src="icon/labbottle_icon.png" alt="">
                    <img src="icon/app_icon.png" alt="">
                    <img src="icon/user.png" alt="">
                </div>
            </div>
        </div>
        <div class="item2">
            <div class="google"><img src="icon/google.webp" alt=""></div>
        </div>
        <div class="item3">
            <div class="search-section">
                <a href="#searchicon"><img src="icon/search_icon.png" alt=""></a>
                <input type="text" class="Search-bar" placeholder="" />
                <a href="#mic_button"><img src="icon/mic_icon.png" alt=""></a>
                <a href="#google_photo_search"><img src="icon/camera_icon.png" alt=""></a>
            </div>
            <div class="button-search-section">
                <button class="google-search">Google Search</button>
                <button class="feeling-lucky">I'm Feeling Lucky</button>
            </div>
        </div>
        <div class="item4">
            <p class="google-offered">Google offered in:</p>
            <p class="google-language">&nbsp;हिन्दी বাংলা తెలుగు मराठी தமிழ் ગુજરાતી ಕನ್ನಡ മലയാളം ਪੰਜਾਬੀ</p>
        </div>
        <div class="item5">
            <div class="india">India</div>
            
        </div>
        <div class="item6">
            <div class="bottom-section1">
                <p>Advertising</p>
                <p>Business</p>
                <p>How Search Works</p>
            </div>
            <div class="bottom-section2">
                <p>Privacy</p>
                <p>Terms</p>
                <p>Settings</p>
            </div>
        </div>
    </main>
</body>
</html>
